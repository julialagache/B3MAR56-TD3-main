<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js ar - hit test</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link type="text/css" rel="stylesheet" href="main.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	</head>
	<body>

		<script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { ARButton } from 'three/addons/webxr/ARButton.js';
			import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js';
			import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';

			let container;
			let camera, scene, renderer;
			let controller1, controller2;
			let reticle;
			let currentObject, controls;
			let currentUrl = 'models/1.glb';

			let hitTestSource = null;
			let hitTestSourceRequested = false;

			init();

			function init() {

				container = document.getElementById( 'container' );
				document.body.appendChild( container );

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 );

				const light = new THREE.HemisphereLight( 0xffffff, 0xbbbbff, 3 );
				light.position.set( 0.5, 1, 0.25 );
				scene.add( light );

				//

				renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.xr.enabled = true;
				container.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0, - 0.5 );
				controls.enableDamping = true;
				controls.addEventListener( 'change', render );

				//

				const arButton = ARButton.createButton( renderer, {
                requiredFeatures: [ 'hit-test' ],
                optionalFeatures: [ 'dom-overlay' ],
                domOverlay: { root: document.body }
                } );
				document.body.appendChild( arButton );

				$( '#ARButton' ).click( function () {
					if ( currentObject ) currentObject.visible = false;
				} );

				//

				function onSelect() {

					if ( ! reticle.visible || ! currentObject ) return;

					const object = currentObject.clone();
					object.position.setFromMatrixPosition( reticle.matrix );
					object.visible = true;
					scene.add( object );
					render();

				}

				controller1 = renderer.xr.getController( 0 );
				controller1.addEventListener( 'select', onSelect );
				scene.add( controller1 );

				controller2 = renderer.xr.getController( 1 );
				controller2.addEventListener( 'select', onSelect );
				scene.add( controller2 );

				reticle = new THREE.Mesh(
					new THREE.RingGeometry( 0.15, 0.2, 32 ).rotateX( - Math.PI / 2 ),
					new THREE.MeshBasicMaterial()
				);
				reticle.matrixAutoUpdate = false;
				reticle.visible = false;
				scene.add( reticle );

				//

				window.addEventListener( 'resize', onWindowResize );

				$( '.ar-object' ).on( 'click', function ( event ) {
                    event.preventDefault();
                    currentUrl = $( this ).attr( 'data-model' );
				loadModel( currentUrl );
                } );

				loadModel( currentUrl );

			}

			function loadModel( modelUrl ) {

				if ( currentObject ) scene.remove( currentObject );

				new GLTFLoader().load( modelUrl, function ( glb ) {
					currentObject = glb.scene;
					currentObject.visible = false;

					const box = new THREE.Box3().setFromObject( currentObject );
					const size = box.getSize( new THREE.Vector3() );
					const maxSize = Math.max( size.x, size.y, size.z );
					if ( maxSize > 0 ) currentObject.scale.setScalar( 0.5 / maxSize );

					scene.add( currentObject );
					render();
				}, undefined, function ( error ) {
					console.error( 'Impossible de charger le modele :', modelUrl, error );
				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate( timestamp, frame ) {

				if ( frame ) {

					const referenceSpace = renderer.xr.getReferenceSpace();
					const session = renderer.xr.getSession();

					if ( hitTestSourceRequested === false ) {

						session.requestReferenceSpace( 'viewer' ).then( function ( referenceSpace ) {

							session.requestHitTestSource( { space: referenceSpace } ).then( function ( source ) {

								hitTestSource = source;

							} );

						} );

						session.addEventListener( 'end', function () {

							hitTestSourceRequested = false;
							hitTestSource = null;
							reticle.visible = false;

							if ( currentObject ) {
								const box = new THREE.Box3().setFromObject( currentObject );
								box.getCenter( controls.target );
								controls.update();
							}

						} );

						hitTestSourceRequested = true;

					}

					if ( hitTestSource ) {

						const hitTestResults = frame.getHitTestResults( hitTestSource );

						if ( hitTestResults.length ) {

							const hit = hitTestResults[ 0 ];

							reticle.visible = true;
							reticle.matrix.fromArray( hit.getPose( referenceSpace ).transform.matrix );

						} else {

							reticle.visible = false;

						}

					}

				}

				renderer.render( scene, camera );

			}

			function render() {
				renderer.render( scene, camera );
			}

		</script>
		<div id="container"></div>
		<div id="mySidenav" class="sidenav">
			<a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
			<a class="ar-object" data-model="models/1.glb" href="#">Objet 1</a>
			<a class="ar-object" data-model="models/2.glb" href="#">Objet 2</a>
			<a class="ar-object" data-model="models/3.glb" href="#">Objet 3</a>
			<a class="ar-object" data-model="models/4.glb" href="#">Objet 4</a>
		</div>

		<button class="menu-button" onclick="openNav()" aria-label="Ouvrir le menu">&#9776; <span>Objets</span></button>

<script>
function openNav() {
  document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
  document.getElementById("mySidenav").style.width = "0";
}
</script>
	</body>
</html>
